name: API Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: api-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://reqres.in/api
      API_KEY: ${{ secrets.REQRES_API_KEY }}
      TEST_USER_EMAIL: eve.holt@reqres.in
      TEST_USER_PASSWORD: cityslicka
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Validate CI configuration
        run: |
          if [ -z "$API_KEY" ]; then
            echo "::error::Missing REQRES_API_KEY secret for this workflow context"
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Check code quality
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Run API tests
        run: npm test -- --forbid-only

name: API Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: api-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    outputs:
      report-artifact-id: ${{ steps.pages-artifact.outputs.artifact_id }}
    env:
      BASE_URL: https://reqres.in/api
      API_KEY: ${{ secrets.REQRES_API_KEY }}
      TEST_USER_EMAIL: eve.holt@reqres.in
      TEST_USER_PASSWORD: cityslicka
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Validate CI configuration
        run: |
          if [ -z "$API_KEY" ]; then
            echo "::error::Missing REQRES_API_KEY secret for this workflow context"
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Check code quality
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Run API tests
        run: npm run test:report -- --forbid-only
      - name: Upload failure report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: api-test-failure-report
          path: reports/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload HTML report for GitHub Pages
        id: pages-artifact
        if: always() && github.ref == 'refs/heads/main' && hashFiles('reports/index.html') != ''
        uses: actions/upload-pages-artifact@v5
        with:
          path: reports

  publish-report:
    name: Publish HTML report
    needs: test
    if: always() && github.ref == 'refs/heads/main' && needs.test.outputs.report-artifact-id != ''
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Deploy report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Add report link to the job summary
        env:
          REPORT_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo '## API test report' >> "$GITHUB_STEP_SUMMARY"
          echo "[Open the latest HTML report]($REPORT_URL)" >> "$GITHUB_STEP_SUMMARY"
